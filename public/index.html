<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Button Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <p class="eyebrow">GLOBAL BUTTON GAME</p>
    <h1 id="score">0</h1>
    <p class="subtitle">Every click counts for everyone.</p>

    <button id="clickButton" type="button">
      CLICK ME
    </button>

    <p id="status" class="status">Connecting...</p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
